name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write  # required for npm provenance (sigstore)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Deliberately no `registry-url`: it makes setup-node write an .npmrc with
      # `_authToken=${NODE_AUTH_TOKEN}` and, with no token supplied, export
      # NODE_AUTH_TOKEN as the literal placeholder "XXXXX-XXXXX-XXXXX-XXXXX".
      # npm then authenticates with that bogus token instead of falling through
      # to OIDC, and the publish fails with a misleading 404 on PUT.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 still bundles 10.x.
      # Pinned to the 11.x line rather than @latest: releases should not ride on
      # whatever major npm shipped that morning.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g "npm@^11.5.1"
          npm --version

      - run: npm ci

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          version="${{ steps.tag.outputs.version }}"
          pkgver=$(node -p "require('./package.json').version")
          if [ "$version" != "$pkgver" ]; then
            echo "::error::Tag $tag does not match package.json version $pkgver"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run build

      # Authenticates via OIDC against the trusted publisher configured on npm
      # for this package (repo + this workflow file). No NPM_TOKEN: a long-lived
      # token expires silently and npm answers an unauthorized publish with a
      # confusing 404 on PUT. Provenance is automatic under trusted publishing.
      #
      # This package has never been published, and a trusted publisher is
      # configured on a package's own settings page — so the very first publish
      # may still need a token. Verify before cutting the first tag.
      - name: Publish to npm
        run: npm publish --access public

      - name: Extract release notes for this version
        run: |
          version="${{ steps.tag.outputs.version }}"
          # Pull the section for this version from CHANGELOG.md into a file.
          # We write to a file (not a workflow output) so the content never
          # passes through shell interpolation — release notes contain
          # backticks, brackets, parentheses, and other shell metachars.
          awk -v ver="$version" '
            BEGIN { capturing=0 }
            $0 ~ "^## \\[" ver "\\]" { capturing=1; print; next }
            capturing && $0 ~ "^## \\[" { capturing=0 }
            capturing { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release ${{ steps.tag.outputs.tag }}" > /tmp/release-notes.md
          fi
          echo "=== Release notes preview ==="
          head -50 /tmp/release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" --json tagName --jq '.tagName' >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "$tag" \
              --notes-file /tmp/release-notes.md \
              --verify-tag
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file /tmp/release-notes.md \
              --verify-tag
          fi
