name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write  # required for npm provenance (sigstore)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          version="${{ steps.tag.outputs.version }}"
          pkgver=$(node -p "require('./package.json').version")
          if [ "$version" != "$pkgver" ]; then
            echo "::error::Tag $tag does not match package.json version $pkgver"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Extract release notes for this version
        run: |
          version="${{ steps.tag.outputs.version }}"
          # Pull the section for this version from CHANGELOG.md into a file.
          # We write to a file (not a workflow output) so the content never
          # passes through shell interpolation — release notes contain
          # backticks, brackets, parentheses, and other shell metachars.
          awk -v ver="$version" '
            BEGIN { capturing=0 }
            $0 ~ "^## \\[" ver "\\]" { capturing=1; print; next }
            capturing && $0 ~ "^## \\[" { capturing=0 }
            capturing { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release ${{ steps.tag.outputs.tag }}" > /tmp/release-notes.md
          fi
          echo "=== Release notes preview ==="
          head -50 /tmp/release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" --json tagName --jq '.tagName' >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "$tag" \
              --notes-file /tmp/release-notes.md \
              --verify-tag
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file /tmp/release-notes.md \
              --verify-tag
          fi
